[project]
name = "blind-mcp"
version = "0.1.0"
description = "MCP server for researching companies on Blind (teamblind.com)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "mcp>=2"]

[project.scripts]
blind-mcp = "blind_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blind_mcp"]

[dependency-groups]
dev = [
    "pytest>=8",
]
